<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 50% 40%, #ffffff 0%, #f4f7fb 45%, #e9eef5 100%);
        color: #111827;
    }

    /* Logo */

    .logo {
        position: fixed;
        top: 28px;
        left: 35px;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #111827;
        z-index: 10;
    }


    /* Main container */

    .main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
    }


    /* Shortener card */

    .shortener {
        width: 100%;
        max-width: 650px;
        text-align: center;
    }


    .shortener h1 {
        margin: 0 0 10px;
        font-size: 42px;
        font-weight: 750;
        letter-spacing: -1.5px;
    }


    .shortener p {
        margin: 0 0 30px;
        color: #6b7280;
        font-size: 16px;
    }


    /* URL form */

    .url-form {
        display: flex;
        gap: 10px;
        padding: 8px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }


    .url-input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        padding: 14px 16px;
        font-size: 15px;
        background: transparent;
    }


    .generate-btn {
        border: none;
        padding: 0 24px;
        border-radius: 10px;
        background: #111827;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
    }


    .generate-btn:hover {
        transform: translateY(-1px);
        background: #000000;
    }


    /* Result */

    .result {
        margin-top: 25px;
        padding: 18px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }


    .result-box {
        display: flex;
        gap: 8px;
    }


    .short-url {
        flex: 1;
        min-width: 0;
        border: 1px solid #e5e7eb;
        border-radius: 9px;
        padding: 12px;
        font-size: 14px;
        outline: none;
        background: #f9fafb;
    }


    .copy-btn,
    .another-btn {
        border: none;
        border-radius: 9px;
        padding: 0 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
    }


    .copy-btn {
        background: #111827;
        color: white;
    }


    .copy-btn:hover {
        background: #000000;
    }


    .another-btn {
        margin-top: 12px;
        width: 100%;
        height: 42px;
        background: #f3f4f6;
        color: #374151;
    }


    .another-btn:hover {
        background: #e5e7eb;
    }


    /* Mobile */

    @media (max-width: 600px) {

        .logo {
            top: 20px;
            left: 20px;
            font-size: 22px;
        }

        .shortener h1 {
            font-size: 32px;
        }

        .shortener p {
            font-size: 14px;
        }

        .url-form {
            flex-direction: column;
        }

        .url-input {
            width: 100%;
        }

        .generate-btn {
            height: 46px;
        }

        .result-box {
            flex-direction: column;
        }

        .copy-btn {
            height: 44px;
        }
    }

</style>




<body>


<div class="logo">
    LITTLY
</div>

<main class="main">

<div class="shortener">

    <form action="" method="post" class="url-form">

        {% csrf_token %}

        <input
            class="url-input"
            type="text"
            placeholder="Paste your long URL"
            name="original"
            required
        >

        <button
            type="submit"
            class="generate-btn"
        >
            Shorten
        </button>

    </form>


    {% if url %}

    <div class="result">

        <div class="result-box">

            <input
                class="short-url"
                type="text"
                value="http://127.0.0.1:8000{% url 'redirect' short_code=url.short_url %}"
                id="shortUrl"
                readonly
            >

            <button
                type="button"
                class="copy-btn"
                onclick="copyUrl()"
            >
                Copy
            </button>

        </div>


        <button
            type="button"
            class="another-btn"
            onclick="shortenAnother()"
        >
            Shorten another URL
        </button>

    </div>

    {% endif %}

</div>

</main>

<script>

    function copyUrl() {

        const input = document.getElementById("shortUrl");

        navigator.clipboard.writeText(input.value);

    }


    function shortenAnother() {

        window.location.href = "/";

    }

</script>



    




</body>
</html>
